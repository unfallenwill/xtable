[package]
name = "xtable-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "xtable"
path = "src/main.rs"

[dependencies]
xtable-core = { path = "../xtable-core" }
xtable-storage = { path = "../xtable-storage" }
xtable-backend = { path = "../xtable-backend" }
xtable-auth = { path = "../xtable-auth" }
xtable-tx = { path = "../xtable-tx" }
xtable-schema = { path = "../xtable-schema" }
xtable-telemetry = { path = "../xtable-telemetry" }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
hyper = { workspace = true }
http = "1.1"
tracing = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# OpenTelemetry handles live in `xtable-telemetry` (re-exported where needed).

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }